<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasserhahn-Applet: Änderungsrate und Bestand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        .tank-container {
            position: relative;
            width: 100%;
            max-width: 200px;
            height: 300px;
            border: 4px solid #4a5568;
            border-top: none;
            border-radius: 0 0 8px 8px;
            background-color: #f7fafc;
            overflow: hidden;
            margin: 0 auto;
        }
        .water-level {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #4299e1;
            transition: height 0.1s ease-out;
        }
        .water-surface {
            position: absolute;
            top: 0;
            width: 100%;
            height: 6px;
            background-color: #3182ce;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-blue-600 mb-6 border-b pb-2">Wasserhahn-Modell: Vom Graphen zum Bestand</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="col-span-1 space-y-6 bg-gray-100 p-4 rounded-lg border border-gray-200">
                <div>
                    <label class="block text-sm font-semibold mb-1">Zuflussrate f(x) (in Liter/Min):</label>
                    <input type="text" id="funcInput" value="-0.2 * (x - 5)^2 + 6" 
                           class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Gültige Syntax: z.B. 2*x, x^2, sin(x)</p>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Startzeit:</label>
                        <input type="number" id="xMin" value="0" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Endzeit:</label>
                        <input type="number" id="xMax" value="10" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Anfangsbestand:</label>
                        <input type="number" id="initialVolume" value="5" class="w-full border rounded p-2">
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-300">
                    <label class="block text-sm font-semibold mb-2">Zeitverlauf (x = <span id="timeDisplay">0</span> Min):</label>
                    <input type="range" id="timeSlider" min="0" max="10" step="0.1" value="0" 
                           class="w-full accent-blue-600">
                </div>
                
                <div class="bg-blue-50 p-3 rounded border border-blue-200">
                    <p class="text-sm"><strong>Momentane Rate:</strong> <span id="rateDisplay">0.00</span> L/Min</p>
                    <p class="text-sm text-blue-700 mt-1"><strong>Aktueller Bestand:</strong> <span id="volumeDisplay">0.00</span> Liter</p>
                </div>
            </div>

            <div class="col-span-1 md:col-span-2 flex flex-col md:flex-row gap-6">
                <div class="flex-grow w-full h-[400px]" id="graphDiv"></div>
                
                <div class="w-full md:w-1/3 flex flex-col items-center justify-end">
                    <h3 class="text-sm font-bold mb-2 text-center">Wasserbecken</h3>
                    <div class="tank-container shadow-inner">
                        <div id="waterFill" class="water-level" style="height: 0%;">
                            <div class="water-surface"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const funcInput = document.getElementById('funcInput');
        const xMinInput = document.getElementById('xMin');
        const xMaxInput = document.getElementById('xMax');
        const initialVolumeInput = document.getElementById('initialVolume');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const rateDisplay = document.getElementById('rateDisplay');
        const volumeDisplay = document.getElementById('volumeDisplay');
        const waterFill = document.getElementById('waterFill');
        const graphDiv = document.getElementById('graphDiv');

        let compiledNode;
        let tankCapacity = 1; 

        // Funktion auswerten
        function evaluateFunc(x) {
            try {
                return compiledNode.evaluate({ x: x });
            } catch (e) {
                return 0;
            }
        }

        // Numerische Integration (Trapezregel)
        function integrate(start, end, steps = 200) {
            if (start === end) return 0;
            let sum = 0;
            const dx = (end - start) / steps;
            for (let i = 0; i < steps; i++) {
                let x1 = start + i * dx;
                let x2 = start + (i + 1) * dx;
                sum += (evaluateFunc(x1) + evaluateFunc(x2)) / 2 * dx;
            }
            return sum;
        }

        function initApp() {
            try {
                compiledNode = math.parse(funcInput.value).compile();
            } catch (e) {
                alert("Ungültige Funktionseingabe.");
                return;
            }

            const xMin = parseFloat(xMinInput.value) || 0;
            const xMax = parseFloat(xMaxInput.value) || 10;
            const initialVol = parseFloat(initialVolumeInput.value) || 0;
            
            timeSlider.min = xMin;
            timeSlider.max = xMax;
            
            // Verhindern, dass der Regler außerhalb der neuen Grenzen liegt
            let currentSliderVal = parseFloat(timeSlider.value);
            if(currentSliderVal < xMin) timeSlider.value = xMin;
            if(currentSliderVal > xMax) timeSlider.value = xMax;
            
            // Finde das absolute Maximalvolumen im Zeitraum für die Becken-Skalierung
            let maxVolReached = initialVol;
            const steps = 100;
            const dx = (xMax - xMin) / steps;
            let runningVol = initialVol;
            
            for (let i = 0; i < steps; i++) {
                let x1 = xMin + i * dx;
                let x2 = xMin + (i + 1) * dx;
                let dV = (evaluateFunc(x1) + evaluateFunc(x2)) / 2 * dx;
                runningVol += dV;
                if (runningVol > maxVolReached) {
                    maxVolReached = runningVol;
                }
            }
            
            // Die Beckenkapazität wird auf 105% des erreichten Maximums gesetzt (nahezu voll am Peak)
            // Falls das Volumen nie über 0 steigt, setzen wir einen Dummy-Wert, damit das Layout nicht bricht.
            tankCapacity = maxVolReached > 0 ? maxVolReached / 0.95 : 10;
            
            updateApp();
        }

        function updateApp() {
            const xMin = parseFloat(xMinInput.value) || 0;
            const xMax = parseFloat(xMaxInput.value) || 10;
            const initialVol = parseFloat(initialVolumeInput.value) || 0;
            const currentTime = parseFloat(timeSlider.value);
            
            timeDisplay.innerText = currentTime.toFixed(1);
            
            const currentRate = evaluateFunc(currentTime);
            rateDisplay.innerText = currentRate.toFixed(2);
            
            const currentVolume = initialVol + integrate(xMin, currentTime);
            volumeDisplay.innerText = currentVolume.toFixed(2);
            
            // Wasserstand berechnen (Prozent von der berechneten Beckenkapazität)
            let fillPercent = (currentVolume / tankCapacity) * 100;
            fillPercent = Math.max(0, Math.min(100, fillPercent)); // Begrenzen zwischen 0 und 100
            waterFill.style.height = `${fillPercent}%`;

            drawGraph(xMin, xMax, currentTime);
        }

        function drawGraph(xMin, xMax, currentTime) {
            const xValues = [];
            const yValues = [];
            const xFill = [];
            const yFill = [];
            
            const steps = 200;
            const dx = (xMax - xMin) / steps;
            
            for (let i = 0; i <= steps; i++) {
                let x = xMin + i * dx;
                let y = evaluateFunc(x);
                xValues.push(x);
                yValues.push(y);
                
                if (x <= currentTime) {
                    xFill.push(x);
                    yFill.push(y);
                }
            }

            const traceLine = {
                x: xValues,
                y: yValues,
                mode: 'lines',
                name: 'Rate f(x)',
                line: {color: '#2b6cb0', width: 3}
            };

            const traceArea = {
                x: [...xFill, xFill[xFill.length-1], xFill[0]],
                y: [...yFill, 0, 0],
                fill: 'toself',
                fillcolor: 'rgba(66, 153, 225, 0.4)',
                line: {color: 'transparent'},
                name: 'Integrierte Fläche',
                hoverinfo: 'none'
            };

            const layout = {
                margin: { t: 20, b: 40, l: 40, r: 20 },
                xaxis: { title: 'Zeit x (Min)' },
                yaxis: { title: 'Zuflussrate f(x) (L/Min)' },
                showlegend: false,
                hovermode: 'x'
            };

            Plotly.react(graphDiv, [traceArea, traceLine], layout, {displayModeBar: false});
        }

        // Event Listener
        funcInput.addEventListener('change', initApp);
        xMinInput.addEventListener('change', initApp);
        xMaxInput.addEventListener('change', initApp);
        initialVolumeInput.addEventListener('change', initApp);
        timeSlider.addEventListener('input', updateApp);

        // Init beim Laden
        initApp();
    </script>
</body>
</html>
